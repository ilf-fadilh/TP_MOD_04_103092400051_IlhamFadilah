<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC Parts Store Frieren</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/frieren-dangak.png" type="image/png" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <a href="#home" class="logo">PC PARTS STORE</a>
      <nav>
        <ul class="menu">
          <li><a href="#home">Home</a></li>
          <li><a href="#products">Products</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <!-- SECTION HOME -->
      <section id="home" class="hero">
        <h2>
          Upgrade PC, Maksimalkan <span class="highlight">Performa.</span>
        </h2>
      </section>

      <!-- SECTION COLLECTIONS / PRODUCTS -->
      <section id="products">
        <h2 class="section-title">Products</h2>
        <div class="product-grid">
          <article class="card">
            <img src="images/ssd-frieren.jpeg" alt="SSD" />
            <p>SSD</p>
          </article>
          <article class="card">
            <img src="images/ram-frieren.jpeg" alt="RAM" />
            <p>RAM</p>
          </article>
          <article class="card">
            <img src="images/cpu-frieren.jpeg" alt="Prosesor" />
            <p>Prosesor</p>
          </article>
          <article class="card">
            <img src="images/gpu-frieren.jpg" alt="Kartu Grafis" />
            <p>Kartu Grafis</p>
          </article>
        </div>
      </section>

      <!-- SECTION ABOUT -->
      <section id="about">
        <h2 class="section-title">About</h2>
        <p class="about-text">
          Pilihan komponen untuk kebutuhan upgrade PC Wibu kamu.
        </p>
      </section>
    </main>
  </body>
</html>
